[project]
name = "bastus"
version = "0.1.0"
description = "Batch Automation for Safety Testing and Usability Scenarios — automated multi-turn/multimodal red-teaming for LLM guardrails"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "greenlet>=3.5.4",
]

[project.scripts]
bastus = "bastus.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bastus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
